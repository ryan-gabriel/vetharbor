[project]
name = "vetharbor-api"
version = "0.1.0"
description = "Vetharbor FastAPI modular monolith (SPEC.md; docs/ARCHITECTURE.md §3)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "filetype>=1.2.0",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.0.0",
    "python-multipart>=0.0.20",
    "spacy>=3.8.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "A", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
exclude = ["^migrations/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "psycopg.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "unit: pure tests, no external services (TESTING.md §4)",
    "integration: requires real Postgres (TESTING.md §5)",
    "contract: OpenAPI/auth-negative (TESTING.md §6)",
    "security: guardrails and guard tests (TESTING.md §7)",
    "ml: scoring, drift, fairness (TESTING.md §9)",
    "a11y: accessibility assertions (TESTING.md §8)",
    "e2e: cross-language smoke (TESTING.md §10)",
    "kind: infrastructure proofs (TESTING.md §11)",
    "slow: excluded from the default loop",
    "quarantine: flaky, max 14 days (TESTING.md §15)",
]
