name: ci

# M0 gate: documentation guards plus the real Python and web quality gates
# (TESTING.md §12). No third-party credentials and no metered API calls:
# providers are pinned to the fakes, so this workflow cannot spend quota
# (AGENTS.md §3.5, §3.7).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Governing documents exist
        run: |
          for f in AGENTS.md SPEC.md docs/ARCHITECTURE.md docs/DATA_MODEL.md \
                   docs/DESIGN.md docs/TESTING.md docs/CONTEXT.md; do
            test -f "$f" || { echo "missing $f" >&2; exit 1; }
          done

      - name: Locked-decision consistency pass (CONTEXT.md §7)
        run: |
          # The only occurrences of forbidden variants must be the prohibitions themselves.
          if grep -rn -iE "\b384d\b|all-MiniLM-L6-v2 \(default\)|APScheduler" AGENTS.md SPEC.md docs/*.md \
             | grep -vEi "forbidden|out;|breaks|prohibition|instead of|guard test|greps|no pollers"; then
            echo "found an un-labelled forbidden variant above" >&2; exit 1
          fi

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Python dependencies
        working-directory: apps/api
        run: uv sync --frozen

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Quality gates
        run: make test
